<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>taskmaster</title>
    <meta name="description" content="Break a big task into one small step you can actually start." />
    <!-- PWA / installable, offline-capable -->
    <meta name="theme-color" content="#1a1713" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="taskmaster" />
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <!-- Apply the saved theme before first paint (dark is the default) so there
         is no flash. app.js reconciles this and wires the header toggle. -->
    <script>
      (function () {
        try {
          document.documentElement.setAttribute('data-theme', localStorage.getItem('tm-theme') || 'dark');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <script type="module" crossorigin src="./assets/index-D4GnRiqK.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-D63ouKN2.css">
  <link rel="manifest" href="./manifest.webmanifest"></head>
  <body>
    <!--
      NOTE: this <header>/<main> markup mirrors public/index.html (the desktop
      app's page). It is intentionally duplicated here because the desktop page is
      served raw by src/server.ts and cannot carry this build's module <script>.
      If you change the desktop markup, mirror structural changes here.
    -->
    <header>
      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true" focusable="false">
          <rect x="1" y="1" width="30" height="30" rx="9" fill="var(--accent)" />
          <rect x="8" y="9" width="16" height="2.6" rx="1.3" fill="#fff" opacity="0.95" />
          <rect x="8" y="14.7" width="12" height="2.6" rx="1.3" fill="#fff" opacity="0.8" />
          <rect x="8" y="20.4" width="7" height="2.6" rx="1.3" fill="#fff" opacity="0.6" />
          <circle cx="21" cy="21.7" r="2.4" fill="#fff" />
        </svg>
        <h1>taskmaster</h1>
        <span id="engine-badge" class="badge" title="decomposition engine"></span>
        <button id="save-file-btn" class="ghost mini" type="button" hidden title="Save your tasks to a file">Save…</button>
        <button
          id="undo-btn"
          class="theme-toggle"
          type="button"
          data-action="undo"
          title="Undo last action (Ctrl+Z)"
          aria-label="Undo last action"
        >↶</button>
        <button id="theme-toggle" class="theme-toggle" type="button" aria-label="Toggle color theme"></button>
      </div>
      <p class="tagline">Break the wall into one small step you can actually start.</p>
    </header>

    <main>
      <form id="add-form" autocomplete="off">
        <div class="add-row">
          <input
            id="add-input"
            type="text"
            placeholder="A big task you've been avoiding…"
            aria-label="New task"
          />
          <button type="submit" id="add-btn">Add task</button>
        </div>
        <textarea
          id="add-note"
          class="add-note"
          rows="2"
          placeholder="Optional description — extra context for this task…"
          aria-label="Description (optional)"
        ></textarea>
        <div class="add-meta">
          <label class="due-field">Due
            <input type="date" id="add-deadline" aria-label="Deadline (optional)" />
          </label>
          <span class="recur-field">Repeats
            <select id="add-recur-freq" aria-label="Repeats (optional)">
              <option value="">Never</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
              <option value="everyNDays">Every N days</option>
            </select>
            <span id="add-recur-n-field" class="recur-n-field" hidden>every <input type="number" id="add-recur-n" min="1" value="2" aria-label="Every how many days" /> days</span>
          </span>
          <span class="prio-field">Priority
            <span class="prio-end">low</span>
            <span id="add-priority" class="prio-scale" role="radiogroup" aria-label="Priority, 1 (low) to 5 (high), optional">
              <button type="button" data-p="1" title="1 — low">1</button>
              <button type="button" data-p="2" title="2">2</button>
              <button type="button" data-p="3" title="3 — neutral">3</button>
              <button type="button" data-p="4" title="4">4</button>
              <button type="button" data-p="5" title="5 — high">5</button>
            </span>
            <span class="prio-end">high</span>
            <button type="button" id="prio-clear" class="ghost mini" hidden>clear</button>
          </span>
          <span class="cat-field">Category
            <span id="add-categories" class="seg" role="group" aria-label="Categories, multiple allowed, optional">
              <button type="button" data-cat="work">Work</button>
              <button type="button" data-cat="chores">Chores</button>
              <button type="button" data-cat="fun">Fun</button>
            </span>
          </span>
          <span class="add-meta-hint">all optional</span>
        </div>
      </form>
      <p id="error" class="error" hidden></p>
      <p id="activity" class="activity" hidden></p>

      <section id="ready-section">
        <div class="featured-bar">
          <button id="featured-toggle" class="ghost" type="button" aria-pressed="false">☆ Featured Tasks</button>
          <button id="today-toggle" class="ghost" type="button" aria-pressed="false">☀ Today's Tasks</button>
        </div>
        <div class="section-head">
          <h2>Do next</h2>
          <div class="ready-controls">
            <span id="mode-filter" class="seg" role="group" aria-label="Do next mode — all on by default, click to hide a category">
              <button type="button" data-mode="work">Work</button>
              <button type="button" data-mode="chores">Chores</button>
              <button type="button" data-mode="fun">Fun</button>
            </span>
            <span id="mode-filter-hint" class="hint-inline" hidden></span>
            <button id="one-thing-toggle" class="ghost" type="button" hidden></button>
            <button id="ready-group-toggle" class="ghost mini" type="button">Group…</button>
          </div>
        </div>
        <div id="ready" class="ready"></div>
      </section>

      <section id="map-section">
        <div class="section-head">
          <h2 id="map-toggle" class="collapsible">Task map</h2>
          <div class="ready-controls">
            <span id="map-filter" class="seg" role="group" aria-label="Filter tasks by status">
              <button type="button" data-filter="all">All</button>
              <button type="button" data-filter="open">Open</button>
              <button type="button" data-filter="closed">Closed</button>
            </span>
            <button id="group-toggle" class="ghost mini" type="button">Group into project…</button>
          </div>
        </div>
        <div id="group-bar" class="meta-editor" hidden>
          <span id="group-count"></span>
          <input type="text" id="group-title" placeholder="Project name…" aria-label="New project name" />
          <button type="button" id="group-submit" class="mini go" disabled>Group</button>
          <button type="button" id="group-cancel" class="mini">Cancel</button>
        </div>
        <div id="map"></div>
      </section>

      <section id="projects-section">
        <h2 id="projects-toggle" class="collapsible">Context</h2>
        <div id="projects-list"></div>
      </section>

      <section id="backlog-section">
        <h2 id="backlog-toggle" class="collapsible">Backlog</h2>
        <div id="backlog-list"></div>
      </section>

      <section id="archive-section">
        <h2 id="archive-toggle" class="collapsible">Archive</h2>
        <div id="archive-list"></div>
      </section>
    </main>

  </body>
</html>
